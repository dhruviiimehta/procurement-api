openapi: "3.0.0"
info:
  title: Procurement & Manufacturing API
  version: "1.0.0"
  description: >
    Vendors, raw materials, purchase orders and production data for the
    Kong API gateway demo. Backed by a My JSON Server (Typicode) mock.

servers:
  - url: https://my-json-server.typicode.com/dhruviiimehta/procurement-api
    description: Typicode My JSON Server (replace with your repo)

paths:
  /vendors:
    get:
      operationId: listVendors
      summary: List vendors
      description: Returns all vendors. Filterable by category and status.
      parameters:
        - name: category
          in: query
          required: false
          schema: { type: string }
          description: Filter by vendor category (e.g. metals, electronics)
        - name: status
          in: query
          required: false
          schema: { type: string }
          description: Filter by vendor status (active, on_hold)
      responses:
        "200":
          description: A list of vendors
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Vendor" }
  /vendors/{id}:
    get:
      operationId: getVendor
      summary: Get a vendor by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Vendor details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vendor" }
        "404": { description: Vendor not found }

  /raw-materials:
    get:
      operationId: listRawMaterials
      summary: List raw materials
      parameters:
        - name: vendorId
          in: query
          required: false
          schema: { type: integer }
          description: Filter materials by supplying vendor
      responses:
        "200":
          description: A list of raw materials
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RawMaterial" }
  /raw-materials/{id}:
    get:
      operationId: getRawMaterial
      summary: Get a raw material by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Raw material details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawMaterial" }
        "404": { description: Raw material not found }

  /purchase-orders:
    get:
      operationId: listPurchaseOrders
      summary: List purchase orders
      parameters:
        - name: vendorId
          in: query
          required: false
          schema: { type: integer }
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A list of purchase orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PurchaseOrder" }
  /purchase-orders/{id}:
    get:
      operationId: getPurchaseOrder
      summary: Get a purchase order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Purchase order details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseOrder" }
        "404": { description: Purchase order not found }

  /production-runs:
    get:
      operationId: listProductionRuns
      summary: List production runs
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A list of production runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProductionRun" }

  /quality-inspections:
    get:
      operationId: listQualityInspections
      summary: List quality inspections
      responses:
        "200":
          description: A list of quality inspections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QualityInspection" }

components:
  schemas:
    Vendor:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        rating: { type: number }
        status: { type: string }
    RawMaterial:
      type: object
      properties:
        id: { type: integer }
        sku: { type: string }
        name: { type: string }
        unitCost: { type: number }
        vendorId: { type: integer }
    PurchaseOrder:
      type: object
      properties:
        id: { type: integer }
        vendorId: { type: integer }
        status: { type: string }
        total: { type: number }
        orderDate: { type: string, format: date }
    ProductionRun:
      type: object
      properties:
        id: { type: integer }
        productName: { type: string }
        quantity: { type: integer }
        status: { type: string }
        yieldPct: { type: number, nullable: true }
    QualityInspection:
      type: object
      properties:
        id: { type: integer }
        runId: { type: integer }
        poId: { type: integer }
        result: { type: string }
        defectRate: { type: number }
        inspectedDate: { type: string, format: date }
